<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:">
<title>Monetary's Realm</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The 800x600 game fits the window without distortion; everything else is black. */
  #client { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); }
  ruffle-player { width: 100%; height: 100%; display: block; }
  #status { position: absolute; left: 8px; bottom: 8px; margin: 0; color: #ecebe4; font: bold 12px "Courier New", monospace; white-space: pre-wrap; }
  #status:empty { display: none; }
  /* 8x8 pixel-art fullscreen button, shown on hover. */
  #full { position: absolute; right: 6px; top: 6px; z-index: 20; width: 28px; height: 28px; padding: 2px; cursor: pointer;
    background: #1b1d26; border: 0; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #4a8ae8; opacity: 0; transition: opacity .2s; }
  #client:hover #full, #full:focus-visible { opacity: .85; }
  #full svg { width: 100%; height: 100%; display: block; }
</style>
<div id="client" data-mode="game">
  <button id="full" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" fill="#ecebe4"><path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z"/></svg></button>
</div>
<pre id="status">Loading…</pre>
<script src="vendor/ruffle.js"></script>
<script src="launcher.js"></script>
<script src="panel.js"></script>
<script>
  // Fullscreen for the game container.
  const full = document.querySelector('#full');
  const toggle = () => document.fullscreenElement ? document.exitFullscreen() : document.querySelector('#client').requestFullscreen();
  full.addEventListener('click', toggle);
</script>
